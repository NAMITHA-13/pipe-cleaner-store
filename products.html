<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop all products</title>
  <meta name="description" content="Handmade pipe-cleaner flowers, bouquets, gifts and keychains.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand" aria-label="Home">
        <!-- Logo placeholder: replace with <img src="images/logo.svg" alt="" width="36" height="36"> -->
        <span class="brand__logo" aria-hidden="true">logo</span>
        <span class="brand__name" data-brand>Brand Name</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="products.html" aria-current="page">Shop</a>
        <a href="cart.html" class="cart-link">Cart <span class="cart-count" data-cart-count hidden>0</span></a>
      </nav>
    </div>
  </header>

  <main class="container section--tight">
    <h1 class="page-title">Shop</h1>
    <p class="page-intro">Everything is made to order. Choose a colour on the product page.</p>

    <div class="filter-bar">
      <div class="filters" id="category-filters" role="group" aria-label="Filter by category"></div>
      <p class="muted small" id="product-count" aria-live="polite"></p>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; <span data-year></span> <span data-brand>Brand Name</span>. Handmade with care.</p>
      <p><a href="products.html">Shop</a> &nbsp; <a href="mailto:hello@example.com">hello@example.com</a></p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
