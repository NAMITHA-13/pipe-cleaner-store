<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Hoovu Studio</title>
  <meta name="description" content="Handmade pipe-cleaner flowers, bouquets, gifts and keychains.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand" aria-label="Home">
        <!-- Logo placeholder: replace with <img src="images/logo.svg" alt="" width="36" height="36"> -->
        <img class="brand__logo" src="images/logo.png" alt="Hoovu Studio" width="102" height="44">
        <span class="brand__name"><span class="brand__en" data-brand>Hoovu Studio</span><span class="brand__kn" lang="kn">ಹೂವು ಸ್ಟುಡಿಯೋ</span></span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="cart.html" class="cart-link">Cart <span class="cart-count" data-cart-count hidden>0</span></a>
      </nav>
    </div>
  </header>

  <main class="container section--tight">
    <h1 class="page-title">Checkout</h1>
    <p class="page-intro">We'll use these details to deliver your order and send your invoice.</p>

    <div class="two-col">
      <form id="checkout-form" class="form-panel" novalidate>
        <h2>Contact and delivery</h2>

        <div class="field">
          <label for="customer_name">Full name</label>
          <input id="customer_name" name="customer_name" type="text" autocomplete="name" required aria-describedby="customer_name-error">
          <p class="field-error" id="customer_name-error" role="alert"></p>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required aria-describedby="phone-error">
            <p class="field-error" id="phone-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
            <p class="field-error" id="email-error" role="alert"></p>
          </div>
        </div>

        <div class="field">
          <label for="delivery_address">Delivery address</label>
          <textarea id="delivery_address" name="delivery_address" autocomplete="street-address" rows="3" required aria-describedby="delivery_address-error" placeholder="House no., street, area, city, PIN code"></textarea>
          <p class="field-error" id="delivery_address-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="notes">Order notes <span class="optional">(optional)</span></label>
          <textarea id="notes" name="notes" rows="3" maxlength="500" placeholder="Gift message, colour mix, delivery instructions"></textarea>
        </div>

        <button id="place-order" class="btn btn--primary btn--block" type="submit">Place order</button>
        <p class="form-note">No payment is taken yet. We'll contact you to confirm your order.</p>
      </form>

      <aside class="summary-card" id="checkout-summary" aria-label="Order summary"></aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; <span data-year></span> <span data-brand>Hoovu Studio</span>. Handmade with care.</p>
      <p><a href="products.html">Shop</a> &nbsp; <a href="mailto:hello@example.com">hello@example.com</a></p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
